<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Realm of Legends — Voxel Biome Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;}
html,body{overscroll-behavior:none; overflow:hidden; height:100%; background:#0b0b14; font-family:'Segoe UI',sans-serif; color:#eee;}
#root{position:fixed; inset:0;} 
canvas{display:block; cursor:grab;}
#joystick-zone-left, #joystick-zone-right{position:fixed; bottom:24px; width:46%; height:34%; max-width:220px; max-height:220px; z-index:20; border-radius:50%; background:rgba(255,255,255,0.04);}
#joystick-zone-left{left:24px; border:1px solid rgba(255,255,255,0.12);}
#joystick-zone-right{right:24px; border:1px solid rgba(255,255,255,0.12);}
#stick-left, #stick-right{position:absolute; left:50%; top:50%; width:44%; height:44%; transform:translate(-50%,-50%); border-radius:50%; background:rgba(255,255,255,0.15); backdrop-filter:saturate(140%) blur(4px); -webkit-backdrop-filter:blur(4px); box-shadow:0 0 0 6px rgba(0,0,0,0.35) inset, 0 8px 18px rgba(0,0,0,0.35); pointer-events:none; transition:none;}
#menu-settings{position:fixed; top:14px; right:14px; z-index:30; background:rgba(0,0,0,0.45); color:#fff; border:1px solid rgba(255,255,255,0.15); padding:8px 12px; border-radius:10px; cursor:pointer; font-size:13px; backdrop-filter:blur(8px);}
#panel-settings{position:fixed; inset:0; z-index:40; background:rgba(10,10,18,0.55); display:none; align-items:center; justify-content:center; backdrop-filter:blur(6px);}
#panel-settings .card{background:linear-gradient(180deg,#12122a,#1a1a38); border:1px solid rgba(255,255,255,0.12); padding:22px 22px 18px; border-radius:14px; min-width:260px; max-width:92vw; max-height:86vh; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,0.45);}
#panel-settings h2{font-size:16px; margin-bottom:10px; color:#ff8a9e;}
#panel-settings label{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0; color:#ddd;}
#panel-settings input[type="range"]{width:55%;}
#panel-settings button{background:#ff3b6e; color:#fff; border:none; padding:8px 10px; border-radius:8px; cursor:pointer; margin-top:8px;}
#hud{position:fixed; top:14px; left:14px; z-index:10; background:rgba(0,0,0,0.45); padding:10px 14px; border-radius:10px; font-size:12px; line-height:1.6; pointer-events:none; backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.10);}
.biome-badge{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:10; background:rgba(0,0,0,0.45); padding:8px 14px; border-radius:999px; font-size:12px; border:1px solid rgba(255,255,255,0.10); backdrop-filter:blur(6px);}
</style>
</head>
<body>
<div id="root">
  <div id="hud"><div class="title" style="color:#ff8a9e;font-weight:700;margin-bottom:4px;">⚔️ Realm of Legends</div><div>Déplacement : <kbd>ZQSD</kbd> / joystick gauche</div><div>Caméra : <kbd>Souris</kbd> / joystick droit</div><div><kbd>1-0</kbd> Biomes</div></div>
  <div class="biome-badge" id="biome-badge">🌲 Forêt</div>
  <div id="menu-settings" role="button" aria-label="Paramètres">⚙️ Paramètres</div>
  <div id="joystick-zone-left"><div id="stick-left"></div></div>
  <div id="joystick-zone-right"><div id="stick-right"></div></div>
  <div id="panel-settings"><div class="card"><h2>Paramètres</h2>
    <label>Opacité joysticks <span id="v-opacity">70%</span><input id="r-opacity" type="range" min="20" max="100" value="70"></label>
    <label>Taille joysticks <span id="v-size">100%</span><input id="r-size" type="range" min="60" max="140" value="100"></label>
    <label>Sensibilité caméra <span id="v-sens">1.0</span><input id="r-sens" type="range" min="30" max="250" value="100"></label>
    <label>Rétroaction haptique<input id="chk-haptic" type="checkbox" checked></label>
    <button id="btn-close">Fermer</button>
  </div></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
const dpad = {forward: false, backward: false, left: false, right: false}; 
const yawObject = new THREE.Object3D();
const pitchObject = new THREE.Object3D();
yawObject.add(pitchObject);

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'z' || k === 'w') dpad.forward = true;
  if (k === 's') dpad.backward = true;
  if (k === 'q' || k === 'a') dpad.left = true;
  if (k === 'd') dpad.right = true;
  if (/^[1-9]$/.test(k)) tpBiome(parseInt(k,10)-1);
  if (k === '0') tpBiome(9);
});
document.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'z' || k === 'w') dpad.forward = false;
  if (k === 's') dpad.backward = false;
  if (k === 'q' || k === 'a') dpad.left = false;
  if (k === 'd') dpad.right = false;
});

function makeJoystick(zoneId, stickId, onChange){
  const zone = document.getElementById(zoneId);
  const stick = document.getElementById(stickId);
  let dragging = false;
  const maxR = () => zone.clientWidth * 0.45;
  const apply = (clientX, clientY) => {
    const rect = zone.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const r = Math.hypot(dx, dy);
    const limit = maxR();
    if (r > limit){ dx = dx/r*limit; dy = dy/r*limit; }
    stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    const nx = dx/limit; const ny = dy/limit;
    onChange(nx, ny);
  };
  const start = (x, y) => { dragging = true; apply(x,y); };
  const move  = (x, y) => { if (dragging) apply(x,y); };
  const end   = () => { dragging = false; stick.style.transform = 'translate(-50%,-50%)'; onChange(0,0); };

  zone.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.changedTouches[0]; start(t.clientX, t.clientY); }, {passive:false});
  zone.addEventListener('touchmove',  (e) => { e.preventDefault(); const t = e.touches[0]; move(t.clientX, t.clientY); }, {passive:false});
  zone.addEventListener('touchend',   (e) => { end(); });
  zone.addEventListener('touchcancel',end);
  zone.addEventListener('mousedown', (e) => { start(e.clientX, e.clientY); });
  window.addEventListener('mousemove', (e) => { if (dragging) move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', end);
}

// Joysticks : gauche = déplacement, droite = caméra
makeJoystick('joystick-zone-left', 'stick-left', (x,y) => {
  const deadzone = 0.2;
  dpad.forward = y < -deadzone;
  dpad.backward = y > deadzone;
  dpad.left = x < -deadzone;
  dpad.right = x > deadzone;
});

const lookInput = {x: 0, y: 0}; // Caméra : valeurs brutes du joystick droit
makeJoystick('joystick-zone-right', 'stick-right', (x,y) => {
  const deadzone = 0.15;
  lookInput.x = (Math.abs(x) > deadzone) ? x : 0;
  lookInput.y = (Math.abs(y) > deadzone) ? y : 0;
});

// Settings panel
const panel = document.getElementById('panel-settings');
const btnOpen = document.getElementById('menu-settings');
const btnClose = document.getElementById('btn-close');
btnOpen.addEventListener('click', () => panel.style.display = 'flex');
btnClose.addEventListener('click', () => panel.style.display = 'none');
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); });

// Three.js setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
scene.add(yawObject);
document.getElementById('root').appendChild(renderer.domElement);

scene.add(new THREE.DirectionalLight(0xffdfba, 2.6));
scene.add(new THREE.HemisphereLight(0xb1e1ff,0xb97a20,0.8));
scene.add(new THREE.AmbientLight(0xcfd8dc, 0.6));

const MAX = 28000;
let count = 0;
const voxelGeo = new THREE.BoxGeometry(0.95,0.95,0.95);
const palette = {forest_top:0x4caf50, forest_side:0x5d4037, sand:0xffd54f, stone:0x9e9e9e, water:0x29b6f6, snow:0xe1f5fe, leaves:0x388e3c, wood:0x5d4037, lava:0xff6e40};
function add(x,y,z,color){
  if(count>=MAX) return;
  const m = new THREE.Mesh(voxelGeo, new THREE.MeshLambertMaterial({color}));
  m.position.set(x,y,z);
  world.add(m);
  count++;
}
const world = new THREE.Group();

function biomeRect(cx,cz,w,h,top,side,density){
  for(let x=cx;x<cx+w;x++) for(let z=cz;z<cz+h;z++){
    const base = 4 + Math.floor(Math.sin(x/6)*Math.cos(z/6)*2.5);
    const hh = base + Math.min(density/30, 6);
    for(let y=0;y<=hh;y++){
      const c = (y===hh) ? top : (side || top);
      add(x,y,z,c);
    }
  }
}
biomeRect(0,0,10,8, palette.forest_top, palette.forest_side, 120);
biomeRect(10,0,8,8, palette.sand, palette.forest_side, 30);
biomeRect(18,0,10,8, palette.snow, palette.stone, 80);
biomeRect(0,8,8,8, palette.lava, palette.stone, 50);
biomeRect(8,8,10,10, palette.water, palette.sand, 20);
biomeRect(18,8,10,8, palette.leaves, palette.wood, 160);
biomeRect(0,16,10,10, palette.stone, palette.stone, 45);
biomeRect(10,16,10,8, 0x66bb6a, 0x5d4037, 100);
biomeRect(20,16,8,8, palette.sand, palette.stone, 35);

scene.add(world);

const BIOMES = [
  {name:"🌲 Forêt", ground:0x5d4037, top:0x4caf50, fog:0x88aa88, sky:0x87ceeb, density:120},
  {name:"🏔️ Montagne", ground:0x808080, top:0xcfd8dc, fog:0xaaaaaa, sky:0xb0c4de, density:80},
  {name:"🏜️ Désert", ground:0xffd54f, top:0xffd54f, fog:0xf5e6c8, sky:0xffd700, density:30},
  {name:"❄️ Toundra", ground:0xe1f5fe, top:0xffffff, fog:0xdddddd, sky:0xadd8e6, density:40},
  {name:"🌋 Volcan", ground:0x4a0e0e, top:0xff6e40, fog:0x6e1400, sky:0x8b0000, density:50},
  {name:"🌊 Océen", ground:0x0077b6, top:0x29b6f6, fog:0x004e70, sky:0x00b4d8, density:20},
  {name:"🌿 Jungle", ground:0x1a5c1a, top:0x2e7d32, fog:0x2d5a27, sky:0x4a7c59, density:160},
  {name:"💎 Crystal", ground:0x130022, top:0x8e24aa, fog:0x5c1568, sky:0xd2b4de, density:60},
  {name:"🍄 Champi", ground:0x3a002e, top:0x9932cc, fog:0x5a1d5a, sky:0xda70d6, density:70},
  {name:"🌾 Plaine", ground:0x8bc34a, top:0x8bc34a, fog:0xade8a0, sky:0x87ceeb, density:50},
  {name:"🏛️ Ruines", ground:0x6e6e68, top:0x9e9e90, fog:0x7a786e, sky:0xc0b283, density:45},
  {name:"🌙 Sombre", ground:0x16213e, top:0x1f2b4d, fog:0x1a1a2e, sky:0x0f3460, density:90},
  {name:"🔥 Lave", ground:0x3d0c02, top:0xff4500, fog:0x4a0e0e, sky:0xff8c00, density:25},
  {name:"☁️ Ciel", ground:0xe6f3ff, top:0xffffff, fog:0xe6f3ff, sky:0x87ceeb, density:35},
  {name:"🌺 Floral", ground:0xffb6c1, top:0xff69b4, fog:0x7a2040, sky:0xffe4e1, density:100},
  {name:"⚡ Storm", ground:0x2c3e50, top:0x1abc9c, fog:0x16232e, sky:0x1a1a2e, density:55}
];

let currentBiome = 0;
const biomeBadge = document.getElementById('biome-badge');
function setBiome(i){ currentBiome = ((i % BIOMES.length) + BIOMES.length) % BIOMES.length; biomeBadge.textContent = BIOMES[currentBiome].name; scene.fog = new THREE.Fog(BIOMES[currentBiome].fog, 20, 90); scene.background = new THREE.Color(BIOMES[currentBiome].sky); }
function tpBiome(i){ setBiome(i); yawObject.position.set(i*12, 2.5, 0); camera.position.copy(yawObject.position); }
setBiome(0); tpBiome(0);

const speed = 6;
const lookSens = () => parseFloat((document.getElementById('r-sens')?.value || 100)/100);
yawObject.position.set(0,2.5,0);
camera.position.copy(yawObject.position);
pitchObject.rotation.order = 'YXZ';
pitchObject.rotation.y = 0; pitchObject.rotation.x = 0;

// Mouse look on desktop
renderer.domElement.addEventListener('click', () => { if (!isTouch) renderer.domElement.requestPointerLock?.(); });
document.addEventListener('pointerlockchange', () => pointerLocked = document.pointerLockElement === renderer.domElement);
document.addEventListener('mousemove', (e) => {
  if (!pointerLocked || isTouch) return;
  const sens = lookSens();
  yawObject.rotation.y -= (e.movementX || 0) * 0.002 * sens;
  pitchObject.rotation.x -= (e.movementY || 0) * 0.002 * sens;
  pitchObject.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitchObject.rotation.x));
});

function hapticIfAllowed(ms=8){ try { if (document.getElementById('chk-haptic')?.checked && navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const fwd = (dpad.forward?1:0) - (dpad.backward?1:0);
  const str = (dpad.right?1:0) - (dpad.left?1:0);
  const moveDir = new THREE.Vector3(str, 0, fwd).normalize();
  moveDir.applyQuaternion(yawObject.quaternion);
  yawObject.position.addScaledVector(moveDir, speed * dt);
  yawObject.position.y = Math.max(0.6, yawObject.position.y);

  // Caméra : joystick droit -> rotation directe, sensible par défaut à 0.5
  const sens = lookSens() * 0.5;
  yawObject.rotation.y -= lookInput.x * sens * 2.5;
  pitchObject.rotation.x -= lookInput.y * sens * 2.5;
  pitchObject.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitchObject.rotation.x));

  camera.position.copy(yawObject.position);
  camera.quaternion.copy(pitchObject.quaternion).multiply(yawObject.quaternion);
  renderer.render(scene, camera);
}
animate();

// Settings
const rOpacity = document.getElementById('r-opacity');
const rSize = document.getElementById('r-size');
const rSens = document.getElementById('r-sens');
const vOpacity = document.getElementById('v-opacity');
const vSize = document.getElementById('v-size');
const vSens = document.getElementById('v-sens');
rOpacity?.addEventListener('input', () => { vOpacity.textContent = rOpacity.value+'%'; const a=(parseInt(rOpacity.value,10)/100); document.getElementById('stick-left').style.background=`rgba(255,255,255,${a*0.35})`; document.getElementById('stick-right').style.background=`rgba(255,255,255,${a*0.35})`; });
rSize?.addEventListener('input', () => { vSize.textContent = rSize.value+'%'; const s=parseInt(rSize.value,10)/100; const l=document.getElementById('joystick-zone-left'); const r=document.getElementById('joystick-zone-right'); l.style.maxWidth=(220*s)+'px'; l.style.maxHeight=(220*s)+'px'; r.style.maxWidth=(220*s)+'px'; r.style.maxHeight=(220*s)+'px'; });
rSens?.addEventListener('input', () => { vSens.textContent = (parseInt(rSens.value,10)/100).toFixed(2); });
rOpacity?.dispatchEvent(new Event('input'));

window.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '9') tpBiome(parseInt(e.key,10)-1);
  if (e.key === '0') tpBiome(9);
});

// Touch fallback
renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2){ const dx = (e.touches[0].clientX - e.touches[1].clientX) * 0.003; const dy = (e.touches[0].clientY - e.touches[1].clientY) * 0.003; yawObject.rotation.y -= dx; pitchObject.rotation.x -= dy; pitchObject.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitchObject.rotation.x)); e.preventDefault(); } }, {passive:false});
</script>
</body>
</html>
